<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Pintar Pro Clone</title>
  <style>
    /* Sedikit styling untuk halaman loading */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #00b87c; /* Warna hijau khas Kasir Pintar */
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    .loading-container {
      text-align: center;
    }
    /* Animasi putar (spinner) sederhana */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Tampilan singkat saat aplikasi dibuka -->
  <div class="loading-container">
    <div class="spinner"></div>
    <h2>Memuat Aplikasi...</h2>
  </div>

  <script>
    // Script sederhana untuk simulasi pengecekan sesi login
    // Biasanya di sini kita menggunakan Firebase Auth: "Apakah user sudah login?"
    
    // Untuk prototype ini, kita gunakan setTimeout agar halaman loading
    // terlihat selama 1,5 detik sebelum diarahkan ke halaman login.
    setTimeout(() => {
      // Perintah untuk pindah halaman
      window.location.href = 'login.html'; 
    }, 1500); 
  </script>

</body>
</html>
