<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sera Coffee POS - Login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">
        <!-- FORM LOGIN -->
        <div id="form-login" class="auth-card">
            <div class="logo-box">☕ Sera Coffee</div>
            <h2>Masuk ke Sistem</h2>
            <p>Silakan masuk untuk mengelola kasir</p>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="admin@seracoffee.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>

            <button id="btn-login" class="btn-primary">Masuk</button>
            <p class="switch-text">Belum punya akun? <span id="link-to-register">Daftar sekarang</span></p>
        </div>

        <!-- FORM DAFTAR (Disembunyikan secara default) -->
        <div id="form-register" class="auth-card hidden">
            <div class="logo-box">☕ Sera Coffee</div>
            <h2>Daftar Akun Baru</h2>
            <p>Buat akun untuk akses POS</p>

            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="reg-nama" placeholder="Nama Anda">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="admin@seracoffee.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Minimal 6 karakter">
            </div>

            <button id="btn-register" class="btn-primary">Daftar</button>
            <p class="switch-text">Sudah punya akun? <span id="link-to-login">Masuk di sini</span></p>
        </div>
    </div>

    <!-- Panggil script auth (type="module" karena pakai Firebase nantinya) -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
