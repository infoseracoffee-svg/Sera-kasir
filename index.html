<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Pintar Pro Clone</title>
  <!-- Mengambil Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

  <!-- Container Login -->
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    
    <!-- Logo / Judul -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600">Kasir Web Pro</h1>
      <p class="text-gray-500 text-sm mt-1">Masuk untuk mengelola toko Anda</p>
    </div>

    <!-- Form Login -->
    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
          Email
        </label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="email" type="email" placeholder="email@toko.com">
      </div>
      
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
          Password / PIN
        </label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" type="password" placeholder="******">
      </div>
      
      <div class="flex items-center justify-between">
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="button" onclick="login()">
          Masuk
        </button>
      </div>
    </form>

  </div>

  <script>
    // Logika sederhana untuk pindah halaman
    function login() {
      // Nanti logika ini akan diganti dengan Firebase Authentication
      alert("Fungsi login diklik! Nanti akan diarahkan ke Dashboard.");
    }
  </script>

</body>
</html>
