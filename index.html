
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <title>Login - Sera Coffee POS</title>

  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-container">
    <section class="auth-card">

      <div class="brand">
        <div class="brand-icon">S</div>
        <h1>Sera Coffee</h1>
        <p>Point of Sale</p>
      </div>

      <div class="auth-heading">
        <h2>Selamat Datang</h2>
        <p>Masuk ke akun kasir Anda</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan kata sandi"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            <span>Ingat saya</span>
          </label>

          <a href="#" id="forgotPassword">Lupa kata sandi?</a>
        </div>

        <p id="authMessage" role="status" aria-live="polite"></p>

        <button type="submit" id="loginButton">
          Masuk
        </button>

      </form>

      <div class="auth-footer">
        <p>
          Belum punya akun?
          <a href="daftar.html">Daftar sekarang</a>
        </p>
      </div>

    </section>

    <footer>
      &copy; 2026 Sera Coffee POS
    </footer>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
