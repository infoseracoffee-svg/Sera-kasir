<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sera Coffee POS</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #00b87c; color: white; font-family: 'Segoe UI', sans-serif; }
    .loading-container { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; margin: 0 auto 16px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <h2>Memuat Sera Coffee...</h2>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJsFGevRIW1x_tNTVEqOXmE91AXwcnuiU",
      authDomain: "seracoffeepos.firebaseapp.com",
      projectId: "seracoffeepos",
      storageBucket: "seracoffeepos.firebasestorage.app",
      messagingSenderId: "361363482046",
      appId: "1:361363482046:web:706c1084cadbff697945ef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Cek auth secepat mungkin, tapi beri jeda minimal agar animasi terlihat
    const startTime = Date.now();
    onAuthStateChanged(auth, (user) => {
      const timeElapsed = Date.now() - startTime;
      const delay = Math.max(0, 1000 - timeElapsed); // Minimal tunggu 1 detik
      
      setTimeout(() => {
        window.location.href = user ? "penjualan.html" : "login.html";
      }, delay);
    });
  </script>
</body>
</html>
