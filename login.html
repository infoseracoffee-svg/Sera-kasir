<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kasir Pintar Clone</title>
  <!-- Menghubungkan ke file CSS terpisah -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <div class="login-wrapper">
      <div class="login-box">
        <h1 class="login-title">Kasir Web Pro</h1>
        <p class="login-subtitle">Masuk untuk mengelola toko Anda</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="email@toko.com">
          </div>
          
          <div class="form-group">
            <label for="password">Password / PIN</label>
            <input id="password" type="password" placeholder="******">
          </div>
          
          <!-- Tombol ini menggunakan JavaScript sederhana untuk pindah file -->
          <button class="btn-login" type="button" onclick="window.location.href='penjualan.html'">Masuk</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
