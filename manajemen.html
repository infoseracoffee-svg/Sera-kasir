<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen - Kasir Pintar Clone</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body data-page="manajemen">
  <div class="app-container">

    <!-- MODAL POP-UP TAMBAH BARANG (DENGAN VARIAN) -->
    <div id="modal-tambah" class="modal-overlay">
      <div class="modal-box">
        <h3>Tambah Menu Baru</h3>
        <div class="form-group">
          <label>Nama Menu</label>
          <input type="text" id="input-nama" placeholder="Contoh: Kopi Aren">
        </div>
        <div class="form-group">
          <label>Harga Dasar (Rp)</label>
          <input type="number" id="input-harga" placeholder="Contoh: 15000">
        </div>
        
        <!-- BAGIAN VARIAN -->
        <div style="margin-top: 20px; border-top: 1px dashed #e5e7eb; padding-top: 15px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <label style="font-size:14px; font-weight:bold; color:#374151;">Varian (Opsional)</label>
            <span onclick="tambahBarisVarian()" style="color:#00b87c; font-size:13px; cursor:pointer; font-weight:bold;">+ Tambah</span>
          </div>
          <div id="tempat-varian">
            <!-- Baris input varian akan muncul di sini via JavaScript -->
          </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button class="btn-modal-batal" onclick="tutupModalTambah()">Batal</button>
          <button class="btn-modal-simpan" onclick="simpanBarangBaru()">Simpan</button>
        </div>
      </div>
    </div>

    <!-- OVERLAY DAN SIDEBAR MENU -->
    <div id="overlay-menu" class="overlay" onclick="tutupMenu()"></div>
    <div id="sidebar-menu" class="sidebar">
      <div class="sidebar-header">
        <div class="profile-info">
          <div class="profile-pic">S</div>
          <div><div style="font-weight: bold; font-size: 16px;">Sera Coffee</div><div style="color: #6b7280; font-size: 14px;">Owner</div></div>
        </div>
      </div>
      <div class="sidebar-content">
        <a href="manajemen.html" class="menu-item active"><span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>Manajemen</a>
        <a href="penjualan.html" class="menu-item"><span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></span>Transaksi Penjualan</a>
        <a href="#" onclick="keluarAkun()" class="menu-item" style="color: #ef4444; margin-top: 20px;"><span class="menu-icon-sidebar" style="color: #ef4444;"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>Keluar</a>
      </div>
    </div>
    
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="menu-icon" onclick="bukaMenu()"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div>
        <div class="page-title">Manajemen Menu</div>
      </div>
    </div>

    <!-- KONTEN -->
    <div class="content-area" id="area-produk" style="padding-bottom: 20px;"></div>

  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
