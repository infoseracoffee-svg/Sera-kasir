<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penjualan - Kasir Pintar Clone</title>
  <!-- Pastikan versioning CSS disesuaikan agar tidak terkena cache -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <div class="app-container">

    <!-- =========================================
         1. MODAL POP-UP TAMBAH BARANG
    ========================================= -->
    <div id="modal-tambah" class="modal-overlay">
      <div class="modal-box">
        <h3>Tambah Barang Baru</h3>
        <div class="form-group">
          <label>Nama Barang / Menu</label>
          <input type="text" id="input-nama" placeholder="Contoh: Kopi Aren">
        </div>
        <div class="form-group">
          <label>Harga (Rp)</label>
          <input type="number" id="input-harga" placeholder="Contoh: 15000">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
          <button class="btn-modal-batal" onclick="tutupModalTambah()">Batal</button>
          <button class="btn-modal-simpan" onclick="simpanBarangBaru()">Simpan</button>
        </div>
      </div>
    </div>

    <!-- =========================================
         2. OVERLAY DAN SIDEBAR MENU (KIRI)
    ========================================= -->
    <div id="overlay-menu" class="overlay" onclick="tutupMenu()"></div>
    <div id="sidebar-menu" class="sidebar">
      <div class="sidebar-header">
        <div class="profile-info">
          <div class="profile-pic">S</div>
          <div>
            <div style="font-weight: bold; font-size: 16px;">Sera Coffee</div>
            <div style="color: #6b7280; font-size: 14px;">Owner</div>
          </div>
        </div>
      </div>
      <div class="sidebar-content">
        <a href="#" class="menu-item">
          <span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>Manajemen
        </a>
        <a href="#" class="menu-item active">
          <span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></span>Transaksi Penjualan
        </a>
        <a href="#" class="menu-item">
          <span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></span>Pembelian Supplier
        </a>
        <a href="#" class="menu-item">
          <span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></span>Keuangan
        </a>
        <a href="#" class="menu-item">
          <span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></span>Laporan
        </a>
        <a href="#" class="menu-item">
          <span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>Pengaturan
        </a>
        
        <!-- TOMBOL KELUAR (Terhubung dengan fungsi keluarAkun() di Firebase) -->
        <a href="#" onclick="keluarAkun()" class="menu-item" style="color: #ef4444; margin-top: 20px;">
          <span class="menu-icon-sidebar" style="color: #ef4444;"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>Keluar
        </a>
      </div>
    </div>
    
    <!-- =========================================
         3. HEADER (ATAS)
    ========================================= -->
    <div class="header">
      <div class="header-left">
        <div class="menu-icon" onclick="bukaMenu()"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div>
        <div class="page-title">Penjualan</div>
      </div>
      <div class="header-right">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
    </div>

    <!-- =========================================
         4. ACTION BAR (KATEGORI & TAMBAH)
    ========================================= -->
    <div class="action-bar">
      <span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <!-- Tombol Plus untuk membuka form Tambah Barang -->
      <span class="action-icon" onclick="bukaModalTambah()"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      <span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></span>
      <span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 5h2v14H3zm4 0h1v14H7zm3 0h3v14h-3zm5 0h1v14h-1zm3 0h2v14h-2z"/></svg></span>
      <span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></span>
      <div class="filter-btn">Semua</div>
    </div>

    <!-- =========================================
         5. KONTEN (DAFTAR BARANG DARI FIREBASE)
    ========================================= -->
    <div class="content-area" id="area-produk">
      <!-- Akan diisi otomatis oleh JavaScript -->
    </div>

    <!-- =========================================
         6. BOTTOM BAR (KERANJANG)
    ========================================= -->
    <div class="bottom-bar">
      <button class="cart-btn" onclick="alert('Lanjut ke Pembayaran akan dibuat selanjutnya!')">
        <span id="jumlah-barang" style="font-size: 20px; display:flex; align-items:baseline; gap:4px;">0 <span style="font-size: 14px; font-weight: normal;">Barang</span></span>
        <span style="display:flex; align-items:center; gap:8px;"><span id="total-harga" style="font-size: 14px; font-weight: normal;"></span> LANJUT <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>
      <button class="profile-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
    </div>

  </div>

  <!-- Memanggil Script Firebase (Wajib type="module") -->
  <script type="module" src="script.js"></script>
</body>
</html>
