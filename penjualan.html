<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penjualan - Kasir Pintar Clone</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body data-page="penjualan">
  <div class="app-container">

    <!-- MODAL PILIH VARIAN (KHUSUS KASIR) -->
    <div id="modal-pilih-varian" class="modal-overlay">
      <div class="modal-box">
        <h3 id="varian-judul-produk">Pilih Varian</h3>
        <p style="font-size:13px; color:#6b7280; margin-bottom:16px;">Pilih salah satu varian di bawah ini:</p>
        
        <div id="tempat-pilihan-varian">
          <!-- Daftar pilihan varian akan dimunculkan JavaScript -->
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button class="btn-modal-batal" onclick="tutupModalVarian()">Batal</button>
          <button class="btn-modal-simpan" onclick="konfirmasiVarian()">Ke Keranjang</button>
        </div>
      </div>
    </div>

    <!-- OVERLAY DAN SIDEBAR MENU -->
    <div id="overlay-menu" class="overlay" onclick="tutupMenu()"></div>
    <div id="sidebar-menu" class="sidebar">
      <div class="sidebar-header">
        <div class="profile-info">
          <div class="profile-pic">S</div>
          <div><div style="font-weight: bold; font-size: 16px;">Sera Coffee</div><div style="color: #6b7280; font-size: 14px;">Owner</div></div>
        </div>
      </div>
      <div class="sidebar-content">
        <a href="manajemen.html" class="menu-item"><span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>Manajemen</a>
        <a href="penjualan.html" class="menu-item active"><span class="menu-icon-sidebar"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></span>Transaksi Penjualan</a>
        <a href="#" onclick="keluarAkun()" class="menu-item" style="color: #ef4444; margin-top: 20px;"><span class="menu-icon-sidebar" style="color: #ef4444;"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>Keluar</a>
      </div>
    </div>
    
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="menu-icon" onclick="bukaMenu()"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div>
        <div class="page-title">Penjualan</div>
      </div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <div class="filter-btn">Semua</div>
    </div>

    <!-- KONTEN & BOTTOM BAR -->
    <div class="content-area" id="area-produk"></div>
    <div class="bottom-bar">
      <button class="cart-btn" onclick="alert('Fitur Checkout akan segera dibuat!')">
        <span id="jumlah-barang" style="font-size: 20px; display:flex; align-items:baseline; gap:4px;">0 <span style="font-size: 14px; font-weight: normal;">Barang</span></span>
        <span style="display:flex; align-items:center; gap:8px;"><span id="total-harga" style="font-size: 14px; font-weight: normal;"></span> LANJUT <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>
      <button class="profile-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
    </div>

  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
